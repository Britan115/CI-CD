name: Java Docker Build and Publish
# Workflow triggered on push to main/master or manual dispatch
# Builds Docker image and pushes to Docker Hub
  push:
    branches: [ 'main', 'master' ]
  workflow_dispatch:

env:
  IMAGE_NAME: app-refcard-01

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run tests
        run: mvn -B test

      - name: Package (skip tests for Docker build)
        run: mvn -B -DskipTests package

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Workflow complete
        run: echo "Docker image successfully pushed to Docker Hub."
